<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 簡單控制</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* 深黑色背景與簡約風格 */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }

        /* 連線狀態指示燈 */
        .status-container {
            margin-bottom: 30px;
            padding: 10px 20px;
            border-radius: 50px;
            background: #1e1e1e;
            font-size: 14px;
        }
        #status-dot {
            height: 10px;
            width: 10px;
            background-color: #ff4444; /* 預設紅色 (斷線) */
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* 按鈕設計 */
        .btn-group { display: flex; gap: 20px; }
        button {
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-on { background-color: #00c853; color: white; }
        .btn-off { background-color: #ff3d00; color: white; }
        button:active { transform: scale(0.95); opacity: 0.8; }

        /* 底部資訊 */
        .info { margin-top: 50px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <h1>ESP32 控制面板</h1>

    <div class="status-container">
        <span id="status-dot"></span>
        <span id="status-text">正在連線至伺服器...</span>
    </div>

    <div class="btn-group">
        <button class="btn-on" onclick="sendMsg('ON')">打開 LED</button>
        <button class="btn-off" onclick="sendMsg('OFF')">關閉 LED</button>
    </div>

    <div class="info" id="btn-feedback">等待操作...</div>

    <script>
        // --- 設定區 ---
        const broker = "broker.emqx.io";
        const port = 8084;
        const topic = "myhome/esp32/led"; // 必須與 ESP32 程式碼中的 topicLedControl 一致
        const clientID = "web_" + Math.random().toString(16).substr(2, 8);

        // 初始化 MQTT 客戶端
        const client = new Paho.MQTT.Client(broker, port, clientID);

        // 連線成功回呼
        function onConnect() {
            document.getElementById("status-dot").style.backgroundColor = "#00c853";
            document.getElementById("status-text").innerText = "已連線至 MQTT";
            console.log("Connected");
        }

        // 連線失敗或中斷回呼
        function onFail(err) {
            document.getElementById("status-dot").style.backgroundColor = "#ff4444";
            document.getElementById("status-text").innerText = "連線失敗";
        }

        // 執行連線
        client.connect({
            useSSL: true,
            onSuccess: onConnect,
            onFailure: onFail
        });

        // 發送訊息功能
        function sendMsg(state) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(state);
                message.destinationName = topic;
                client.send(message);
                document.getElementById("btn-feedback").innerText = "已發送: " + state;
            } else {
                alert("目前未連線，請重新整理網頁");
            }
        }
    </script>
</body>
</html>
